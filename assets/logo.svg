<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="devosTitle devosDesc">
  <title id="devosTitle">DevOS cyberpunk logo</title>
  <desc id="devosDesc">A neon D monogram over a synthwave grid, using the DevOS WezTerm palette.</desc>

  <defs>
    <linearGradient id="devosBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0F"/>
      <stop offset="0.55" stop-color="#0D0818"/>
      <stop offset="1" stop-color="#1A0620"/>
    </linearGradient>

    <linearGradient id="devosNeon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FFF7"/>
      <stop offset="0.38" stop-color="#00BFFF"/>
      <stop offset="0.66" stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>

    <linearGradient id="devosChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6E6E6"/>
      <stop offset="0.35" stop-color="#00FFF7"/>
      <stop offset="0.7" stop-color="#FF2E97"/>
      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>

    <radialGradient id="devosHalo" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#00FFF7" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#8A2BE2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A0A0F" stop-opacity="0"/>
    </radialGradient>

    <filter id="devosGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="devosSoftGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="devosScanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#E6E6E6" opacity="0.045"/>
    </pattern>

    <clipPath id="devosFrame">
      <rect width="256" height="256" rx="58"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#devosBg)"/>

  <g clip-path="url(#devosFrame)">
    <rect width="256" height="256" fill="url(#devosHalo)"/>

    <!-- Synthwave horizon and perspective grid -->
    <path d="M0 168h256" stroke="#FF2E97" stroke-width="2" opacity="0.55"/>
    <g stroke="#FF2E97" stroke-width="1.2" opacity="0.32">
      <path d="M-44 256 128 164 300 256"/>
      <path d="M-16 256 128 164 272 256"/>
      <path d="M14 256 128 164 242 256"/>
      <path d="M44 256 128 164 212 256"/>
      <path d="M72 256 128 164 184 256"/>
      <path d="M98 256 128 164 158 256"/>
      <path d="M120 256 128 164 136 256"/>
    </g>
    <g stroke="#00FFF7" stroke-width="1.2" opacity="0.3">
      <path d="M0 184h256"/>
      <path d="M0 204h256"/>
      <path d="M0 228h256"/>
    </g>

    <!-- Orbital rings -->
    <ellipse cx="128" cy="126" rx="98" ry="44" fill="none" stroke="#00FFF7" stroke-width="2" stroke-opacity="0.42" transform="rotate(-24 128 126)"/>
    <ellipse cx="128" cy="126" rx="106" ry="54" fill="none" stroke="#FF2E97" stroke-width="2" stroke-opacity="0.28" transform="rotate(27 128 126)"/>
    <ellipse cx="128" cy="126" rx="82" ry="34" fill="none" stroke="#39FF14" stroke-width="1.5" stroke-opacity="0.22" transform="rotate(-8 128 126)"/>

    <!-- D monogram: glitch offsets -->
    <path d="M72 52h38c50 0 80 30 80 74s-30 74-80 74H72V52Z"
          fill="none" stroke="#00FFF7" stroke-width="12" stroke-linejoin="round" opacity="0.35" transform="translate(-3 0)"/>
    <path d="M72 52h38c50 0 80 30 80 74s-30 74-80 74H72V52Z"
          fill="none" stroke="#FF2E97" stroke-width="12" stroke-linejoin="round" opacity="0.4" transform="translate(3 0)"/>

    <!-- D monogram: neon body -->
    <path d="M72 52h38c50 0 80 30 80 74s-30 74-80 74H72V52Z"
          fill="none" stroke="url(#devosNeon)" stroke-width="11" stroke-linejoin="round" filter="url(#devosGlow)"/>

    <!-- D inner cut -->
    <path d="M72 88h34c29 0 47 15 47 38s-18 38-47 38H72"
          fill="none" stroke="#0A0A0F" stroke-width="8" stroke-linecap="round"/>
    <path d="M72 88h34c29 0 47 15 47 38s-18 38-47 38H72"
          fill="none" stroke="url(#devosChrome)" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="url(#devosSoftGlow)"/>

    <!-- Circuit traces -->
    <g stroke-linecap="round" stroke-width="2.5">
      <path d="M72 52 46 26" stroke="#00FFF7" opacity="0.85"/>
      <path d="M72 200 46 226" stroke="#FF2E97" opacity="0.85"/>
      <path d="M190 126 226 126" stroke="#39FF14" opacity="0.8"/>
      <path d="M140 88 166 62" stroke="#FFD300" opacity="0.8"/>
      <path d="M140 164 166 190" stroke="#8A2BE2" opacity="0.9"/>
    </g>

    <!-- Nodes -->
    <g filter="url(#devosSoftGlow)">
      <circle cx="72" cy="52" r="6" fill="#00FFF7"/>
      <circle cx="72" cy="200" r="6" fill="#FF2E97"/>
      <circle cx="190" cy="126" r="6" fill="#39FF14"/>
      <circle cx="140" cy="88" r="4.5" fill="#FFD300"/>
      <circle cx="140" cy="164" r="4.5" fill="#8A2BE2"/>
      <circle cx="46" cy="26" r="3.5" fill="#00FFF7"/>
      <circle cx="46" cy="226" r="3.5" fill="#FF2E97"/>
      <circle cx="226" cy="126" r="3.5" fill="#39FF14"/>
      <circle cx="166" cy="62" r="3" fill="#FFD300"/>
      <circle cx="166" cy="190" r="3" fill="#8A2BE2"/>
    </g>

    <!-- HUD corner brackets -->
    <g fill="none" stroke-linecap="square" stroke-width="2.5">
      <path d="M26 58V26h32" stroke="#39FF14" opacity="0.85"/>
      <path d="M198 26h32v32" stroke="#00FFF7" opacity="0.85"/>
      <path d="M230 198v32h-32" stroke="#FF2E97" opacity="0.85"/>
      <path d="M58 230H26v-32" stroke="#FFD300" opacity="0.85"/>
    </g>

    <!-- Glitch slice -->
    <g opacity="0.25">
      <rect x="60" y="118" width="136" height="4" fill="#00FFF7"/>
      <rect x="72" y="132" width="112" height="2" fill="#FF2E97"/>
      <rect x="84" y="142" width="88" height="1.5" fill="#39FF14"/>
    </g>

    <rect width="256" height="256" fill="url(#devosScanlines)"/>
  </g>

  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="url(#devosNeon)" stroke-width="3" opacity="0.75"/>
</svg>
