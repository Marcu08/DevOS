name: Supabase

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Supabase configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        id: config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase is not configured. Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF in repository secrets. See README > Setup."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Supabase CLI
        if: steps.config.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase authentication
        if: steps.config.outputs.configured == 'true'
        run: supabase projects list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link project
        if: steps.config.outputs.configured == 'true' && hashFiles('supabase/config.toml') != ''
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        if: steps.config.outputs.configured == 'true' && hashFiles('supabase/migrations/**') != ''
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
